name: Tests + Coverage

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Pest (PHP ${{ matrix.php }}) + Coverage
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.2']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pwt_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      APP_ENV: testing
      APP_KEY: base64:GENERATEDONCI=
      BCRYPT_ROUNDS: 4
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CONTACT_EMAIL_VALIDATE_DNS: 'false'
      SMS_DRIVER: stub
      PAYMENT_DRIVER: stub
      PAYFORT_WEBHOOK_SECRET: ci-stub-secret
      # MySQL service used by MySqlTestCase (translatable-JSON suites)
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: 3306
      MYSQL_TEST_DATABASE: pwt_testing
      MYSQL_TEST_USERNAME: root
      MYSQL_TEST_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }} with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # PCOV is the lightweight coverage driver — fast, low memory,
          # works well with PHPUnit 11 / Pest 3.
          coverage: pcov
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, sqlite3, pdo_sqlite, bcmath, gd, zip, fileinfo
          tools: composer:v2
          ini-values: |
            memory_limit=512M
            pcov.directory=app
            pcov.exclude="~tests|database|config~"

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-all

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare .env
        run: |
          cp .env.example .env || true
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      - name: Generate APP_KEY
        run: php artisan key:generate --force

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL is up"; exit 0
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          echo "MySQL never became ready" >&2
          exit 1

      - name: Storage symlink
        run: php artisan storage:link

      # ----- Quality gates that don't need the test runner -----

      - name: Laravel Pint (style)
        run: ./vendor/bin/pint --test

      - name: PHPStan / Larastan (level 6)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      # ----- Test suite with coverage gate -----

      - name: Run Pest with coverage (--min=80)
        env:
          # MysqlTestCase reads these via the runtime config()
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --coverage --min=80

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-php${{ matrix.php }}
          path: coverage/html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report (clover.xml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover-php${{ matrix.php }}
          path: coverage/clover.xml
          if-no-files-found: ignore
          retention-days: 14
